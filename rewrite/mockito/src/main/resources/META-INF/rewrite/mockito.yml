---
type: specs.openrewrite.org/v1beta/recipe
name: io.sundr.mockito.rewrite.MigrateToMockitoAnnotations
displayName: Migrate a Mockito test suite to the mockito-annotations fluent DSL
description: >-
  Adds the io.sundr:mockito-annotations dependency, generates a @Mockables marker for every mocked
  type, and rewrites Mockito.when(...)/verify(...) call sites and delegated statics into the
  generated fluent DSL. Call sites that cannot be migrated confidently are left untouched with a
  manual-migration TODO.
recipeList:
  - org.openrewrite.maven.AddDependency:
      groupId: org.mockito
      artifactId: mockito-core
      version: latest.release
      scope: test
      onlyIfUsing: org.mockito.Mockito
      acceptTransitive: true
  - io.sundr.mockito.rewrite.AddMockitoAnnotationsDependency
  - io.sundr.mockito.rewrite.AddMockitoAnnotationProcessorPath
  - io.sundr.mockito.rewrite.GenerateMarker
  - io.sundr.mockito.rewrite.RewriteStubbingAndVerify
  - io.sundr.mockito.rewrite.RewriteDelegatedStatics
